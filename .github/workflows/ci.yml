name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e .

      - name: Unit tests
        run: python -m unittest discover -s tests -v

      - name: Demo runs and reports a mixed verdict
        run: |
          rag-eval demo | tee demo.txt
          grep -q "VERDICT" demo.txt
          # The whole point: an improved average must still surface the
          # regression underneath it.
          grep -q "regression" demo.txt
          grep -q "mixed" demo.txt

      - name: Score a set
        run: |
          printf '%s\n' \
            '{"query":"q1","relevant":["a"],"retrieved":["a","x"]}' \
            '{"query":"q2","relevant":["b"],"retrieved":["x","y"]}' \
            > cases.jsonl
          rag-eval score cases.jsonl --json > score.json
          cat score.json
          python - <<'PY'
          import json
          data = json.load(open("score.json"))
          assert data["cases"] == 2
          assert abs(data["metrics"]["recall"] - 0.5) < 1e-6, data["metrics"]
          assert len(data["misses"]) == 1, data["misses"]
          print("score ok")
          PY

      - name: CI gate fails below threshold
        run: |
          set +e
          rag-eval score cases.jsonl --fail-under 0.9
          code=$?
          set -e
          test "$code" -eq 1

      - name: CI gate passes above threshold
        run: rag-eval score cases.jsonl --fail-under 0.4

      - name: Empty relevant list is rejected
        run: |
          printf '%s\n' '{"query":"q","relevant":[]}' > broken.jsonl
          set +e
          rag-eval score broken.jsonl
          code=$?
          set -e
          test "$code" -eq 2

      - name: Regression gate
        run: |
          printf '%s\n' '{"query":"q","relevant":["a"],"retrieved":["a"]}' > base.jsonl
          printf '%s\n' '{"query":"q","relevant":["a"],"retrieved":["x"]}' > cand.jsonl
          set +e
          rag-eval compare base.jsonl cand.jsonl --fail-on-regression
          code=$?
          set -e
          test "$code" -eq 1
